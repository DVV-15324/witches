name: Run tests and upload coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true

      # Dependencies
      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      # Clean
      - name: Clean old coverage files
        run: |
          rm -f coverage*.out
          rm -f coverage*.html
          rm -f coverage_all.out

      # Install coverage merger
      - name: Install gocovmerge
        run: |
          go install github.com/wadey/gocovmerge@latest

      # ============================================================
      # Run tests (theo Makefile)
      # ============================================================

      - name: Run DB connect tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_db_connect.out \
            ./pkg/core/database/connect/sql/...

      - name: Run handler core tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_handler_core.out \
            ./pkg/core/handler/...

      - name: Run handler tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_handler.out \
            ./test/handler/...

      - name: Run response tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_response.out \
            ./pkg/core/response/...

      - name: Run logger tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_logger.out \
            ./pkg/core/response/logger

      - name: Run utils tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_utils.out \
            ./pkg/core/utils

      - name: Run easyjson tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_easyjson.out \
            ./pkg/core/easyjson

      - name: Run templates tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_templates.out \
            ./pkg/core/templates/...

      - name: Run cmd tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_cmd.out \
            ./cmd/root_test.go

      - name: Run cmd utils tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_cmdutils.out \
            ./cmd/utils

      - name: Run cmd database tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_cmd_database.out \
            ./cmd/database

      - name: Run integration tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_integration.out \
            -tags=integration \
            ./pkg/core/utils

      # ============================================================
      # Merge coverage
      # ============================================================

      - name: Merge coverage reports
        run: |
          echo "Merging coverage reports..."
          files=""

          for f in coverage_*.out; do
            if [ -f "$f" ]; then
              echo "Found: $f"
              files="$files $f"
            fi
          done

          if [ -z "$files" ]; then
            echo "ERROR: No coverage files found."
            exit 1
          fi

          "$(go env GOPATH)/bin/gocovmerge" $files > coverage_all.out

          echo ""
          echo "Coverage file generated:"
          wc -l coverage_all.out

          echo ""
          echo "First lines:"
          head -5 coverage_all.out

      # ============================================================
      # Validate coverage
      # ============================================================

      - name: Validate coverage
        run: |
          if [ ! -s coverage_all.out ]; then
            echo "ERROR: coverage_all.out is empty."
            exit 1
          fi

          if ! grep -q "^mode:" coverage_all.out; then
            echo "ERROR: Invalid Go coverage profile."
            exit 1
          fi

          echo "Coverage profile is valid."

      # ============================================================
      # Coverage summary
      # ============================================================

      - name: Coverage summary
        run: |
          echo "========================================"
          echo "          COVERAGE SUMMARY"
          echo "========================================"

          go tool cover -func=coverage_all.out

          echo ""
          echo "========================================"
          echo "              TOTAL"
          echo "========================================"

          go tool cover -func=coverage_all.out | grep total

      # ============================================================
      # HTML coverage
      # ============================================================

      - name: Generate HTML coverage
        run: |
          go tool cover \
            -html=coverage_all.out \
            -o coverage.html

      # ============================================================
      # Upload artifacts
      # ============================================================

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage_all.out
            coverage.html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage_all.out
          fail_ci_if_error: true
          verbose: true
