name: Run tests and upload coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Clean old coverage files
        run: rm -f coverage*.out coverage_all.out

      - name: Run unit tests (skip easyjson packages)
        run: |
          PACKAGES=$(go list ./... | grep -v easyjson | tr '\n' ' ')
          PACKAGES=$(go list ./... | grep -v -e easyjson -e github.com/DVV-15324/witches/cmd/utils | tr '\n' ' ')
          go test -race -coverprofile=coverage.out -covermode=atomic ./pkg/... ./test/handler/pagination
          go test -race -coverprofile=coverage.out -covermode=atomic ./pkg/... ./test/handler/rate_limit
          go test -race -coverprofile=coverage.out -covermode=atomic ./pkg/... ./test/handler/simple

      - name: Run integration tests (if exist)
        run: |
          if [ -d "./pkg/core/utils" ] && [ "$(ls -1 ./pkg/core/utils/*_test.go 2>/dev/null | wc -l)" -gt 0 ]; then
            go test -race -coverprofile=coverage_integration.out -covermode=atomic -tags=integration ./pkg/core/utils
          else
            echo "No integration tests found, skipping."
          fi
      - name: Check coverage file
        run: |
          if [ ! -s coverage_all.out ] || [ "$(wc -l < coverage_all.out)" -le 1 ]; then
            echo "Error: coverage_all.out is empty or invalid!"
            cat coverage_all.out  # In ra để debug
            exit 1
          fi
          echo "Coverage file has $(wc -l < coverage_all.out) lines"
          head -5 coverage_all.out  # In 5 dòng đầu
      - name: Merge coverage reports
        run: |
          echo "mode: atomic" > coverage_all.out
          if [ -f coverage.out ]; then
            cat coverage.out >> coverage_all.out
          fi
          if [ -f coverage_integration.out ]; then
            tail -n +2 coverage_integration.out >> coverage_all.out
          fi
          # Nếu file rỗng, xóa để tránh upload lỗi
          if [ ! -s coverage_all.out ] || [ "$(wc -l < coverage_all.out)" -le 1 ]; then
            echo "No coverage data collected. Removing empty file."
            rm -f coverage_all.out
          fi

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage_all.out
          fail_ci_if_error: true
          verbose: true
