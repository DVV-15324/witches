name: Run tests and upload coverage

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v4
      # Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      # Dependencies
      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify
      # Clean
      - name: Clean old coverage files
        run: |
          rm -f coverage*.out
          rm -f coverage*.html
          rm -f coverage_all.out
      # Install coverage merger
      - name: Install gocovmerge
        run: |
          go install github.com/wadey/gocovmerge@latest
      # Run tests
      - name: Run response tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_response.out \
            ./pkg/core/response/...
      - name: Run utils tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_utils.out \
            ./pkg/core/utils
      - name: Run templates tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_templates.out \
            ./pkg/core/templates/...
      - name: Run pagination handler tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_pagination.out \
            ./test/handler/pagination

      - name: Run rate limit handler tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_rate_limit.out \
            ./test/handler/rate_limit
      - name: Run simple handler tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_simple.out \
            ./test/handler/simple
      # Merge coverage
      - name: Merge coverage reports
        run: |
          echo "Merging coverage reports..."
          files=""

          for f in coverage_*.out; do
            if [ -f "$f" ]; then
              echo "Found: $f"
              files="$files $f"
            fi
          done

          if [ -z "$files" ]; then
            echo "ERROR: No coverage files found."
            exit 1
          fi

          "$(go env GOPATH)/bin/gocovmerge" $files > coverage_all.out

          echo ""
          echo "Coverage file generated:"
          wc -l coverage_all.out

          echo ""
          echo "First lines:"
          head -5 coverage_all.out

      # Validate coverage
      - name: Validate coverage
        run: |
          if [ ! -s coverage_all.out ]; then
            echo "ERROR: coverage_all.out is empty."
            exit 1
          fi

          if ! grep -q "^mode:" coverage_all.out; then
            echo "ERROR: Invalid Go coverage profile."
            exit 1
          fi

          echo "Coverage profile is valid."

      # Coverage summary
      - name: Coverage summary
        run: |
          echo "========================================"
          echo "          COVERAGE SUMMARY"
          echo "========================================"

          go tool cover -func=coverage_all.out

          echo ""
          echo "========================================"
          echo "              TOTAL"
          echo "========================================"

          go tool cover -func=coverage_all.out | grep total

      # HTML coverage
      - name: Generate HTML coverage
        run: |
          go tool cover \
            -html=coverage_all.out \
            -o coverage.html

      # Upload coverage artifact

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage_all.out
            coverage.html

      # Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage_all.out
          fail_ci_if_error: true
          verbose: true
