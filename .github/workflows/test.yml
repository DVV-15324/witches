name: Run tests and upload coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true

      - name: Cache Docker images
        uses: actions/cache@v4
        with:
          path: /tmp/docker-images
          key: docker-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            docker-${{ runner.os }}-

      - name: Download dependencies
        run: go mod download

      - name: Clean go mod cache (optional)
        run: go clean -modcache

      - name: Verify dependencies
        run: go mod verify

      - name: Clean old coverage files
        run: |
          rm -f coverage*.out
          rm -f coverage*.html
          rm -f coverage_all.out

      - name: Install migrate CLI
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          migrate -version

      - name: Install easyjson
        run: |
          go mod tidy
          go install github.com/mailru/easyjson/easyjson@latest
          easyjson -version || true

      - name: Install gocovmerge
        run: |
          go install github.com/wadey/gocovmerge@latest

      - name: Run DB connect tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_db_connect.out \
           -timeout=60s \
            ./pkg/core/database/connect/sql/...

      - name: Run handler core tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_handler_core.out \
            -timeout=60s \
            ./pkg/core/handler/...

      - name: Run response tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_response.out \
            -timeout=60s \
            ./pkg/core/response/...

      - name: Run logger tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_logger.out \
            -timeout=60s \
            ./pkg/core/response/logger

      - name: Run utils tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_utils.out \
            -timeout=60s \
            ./pkg/core/utils

      - name: Run easyjson tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_easyjson.out \
            -timeout=60s \
            ./pkg/core/easyjson

      - name: Run templates tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_templates.out \
            -timeout=60s \
            ./pkg/core/templates/...

      - name: Run cmd run tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_cmd_run.out \
            -timeout=60s \
            ./cmd/run || true

      - name: Run cmd database tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_cmd_database.out \
            -timeout=180s \
            ./cmd/database

      - name: Run cmd migrate tests
        run: |
          # Cài migrate với driver postgres
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

          # Copy binary vào thư mục hiện tại
          cp $(go env GOPATH)/bin/migrate ./migrate-bin

          # Thêm thư mục hiện tại vào PATH (ưu tiên binary vừa build)
          export PATH=$(pwd):$PATH

          # Kiểm tra
          which migrate
          migrate -version

          # Chạy test
          go test -race -covermode=atomic -coverprofile=coverage_migrate.out -timeout=120s ./cmd/migrate/...

      - name: Run cmd utils tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_cmdutils.out \
            -timeout=60s \
            ./cmd/utils

      - name: Run integration tests
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage_integration.out \
            -tags=integration \
            -timeout=60s \
            ./pkg/core/utils

      - name: Merge coverage reports
        run: |
          echo "========================================"
          echo "Merging coverage reports..."
          echo "========================================"

          files=""
          for f in coverage_*.out; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              echo "Found: $f"
              files="$files $f"
            else
              echo "Skipping: $f (empty or not found)"
            fi
          done

          if [ -z "$files" ]; then
            echo "ERROR: No coverage files found."
            exit 1
          fi

          echo ""
          echo "Merging files: $files"
          "$(go env GOPATH)/bin/gocovmerge" $files > coverage_all.out

      - name: Debug merged coverage
        run: |
          echo "========================================"
          echo "CMD/RUN COVERAGE"
          echo "========================================"
          go tool cover -func=coverage_cmd_run.out

          echo ""
          echo "========================================"
          echo "MERGED COVERAGE"
          echo "========================================"
          go tool cover -func=coverage_all.out

          echo ""
          echo "========================================"
          echo "CMD/RUN FILES IN MERGED PROFILE"
          echo "========================================"
          grep "github.com/DVV-15324/witches/cmd/run/" coverage_all.out

      - name: Validate coverage
        run: |
          if [ ! -s coverage_all.out ]; then
            echo "ERROR: coverage_all.out is empty."
            exit 1
          fi

          if ! grep -q "^mode:" coverage_all.out; then
            echo "ERROR: Invalid Go coverage profile."
            exit 1
          fi

          echo "Coverage profile is valid."

      - name: Coverage summary
        run: |
          echo "========================================"
          echo "          COVERAGE SUMMARY"
          echo "========================================"

          go tool cover -func=coverage_all.out

          echo ""
          echo "========================================"
          echo "              TOTAL"
          echo "========================================"

          go tool cover -func=coverage_all.out | grep total

      - name: Generate HTML coverage
        run: |
          go tool cover \
            -html=coverage_all.out \
            -o coverage.html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage_all.out
            coverage.html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage_all.out
          fail_ci_if_error: false
          verbose: true
