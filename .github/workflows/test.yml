name: Run tests and upload coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run all tests
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./pkg/... ./test/handler/...
          go test -race -coverprofile=coverage_integration.out -covermode=atomic -tags=integration ./pkg/core/utils

      - name: Merge coverage
        run: |
          echo "mode: atomic" > coverage_all.out
          cat coverage.out coverage_integration.out | tail -n +2 >> coverage_all.out

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage_all.out
          fail_ci_if_error: true
