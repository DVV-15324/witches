name: Run tests and upload coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Clean old coverage files
        run: rm -f coverage*.out coverage_all.out

      - name: Set environment variables
        run: |
          echo "APP_PORT=8080" >> $GITHUB_ENV
          echo "TEST_EMPTY=dummy_value" >> $GITHUB_ENV
          echo "TEST_INVALID=dummy_value" >> $GITHUB_ENV

      - name: Run tests - pagination
        run: |
          go test -race -coverprofile=coverage_pagination.out -covermode=atomic ./pkg/... ./test/handler/pagination

      - name: Run tests - rate_limit
        run: |
          go test -race -coverprofile=coverage_rate_limit.out -covermode=atomic ./pkg/... ./test/handler/rate_limit

      - name: Run tests - simple
        run: |
          go test -race -coverprofile=coverage_simple.out -covermode=atomic ./pkg/... ./test/handler/simple

      - name: Merge coverage reports
        run: |
          echo "mode: atomic" > coverage_all.out
          for f in coverage_pagination.out coverage_rate_limit.out coverage_simple.out; do
            if [ -f "$f" ]; then
              echo "Adding $f ($(wc -l < $f) lines)"
              tail -n +2 "$f" >> coverage_all.out
            else
              echo "Warning: $f not found"
            fi
          done
          echo "Total lines in coverage_all.out: $(wc -l < coverage_all.out)"

      - name: Validate coverage file
        run: |
          if [ ! -s coverage_all.out ] || [ "$(wc -l < coverage_all.out)" -le 1 ]; then
            echo "Error: coverage_all.out is empty or invalid!"
            exit 1
          fi
          echo "Coverage file valid with $(wc -l < coverage_all.out) lines"
          head -3 coverage_all.out

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage_all.out
          fail_ci_if_error: true
          verbose: true
