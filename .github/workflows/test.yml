name: Run tests and upload coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Clean old coverage files
        run: rm -f coverage*.out coverage_all.out

      - name: Set environment variables
        run: |
          echo "APP_PORT=8080" >> $GITHUB_ENV
          echo "TEST_EMPTY=dummy_value" >> $GITHUB_ENV
          echo "TEST_INVALID=dummy_value" >> $GITHUB_ENV

      - name: Run all tests
        run: |
          # Chạy test và tạo file coverage riêng
          go test -short -race -coverprofile=coverage_pkg.out -covermode=atomic ./pkg/... 2>/dev/null || true
          go test -short -race -coverprofile=coverage_handler.out -covermode=atomic ./test/handler/... 2>/dev/null || true

      - name: Merge coverage files
        run: |
          echo "mode: atomic" > coverage_all.out
          for f in coverage_*.out; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              echo "Adding $f"
              tail -n +2 "$f" >> coverage_all.out 2>/dev/null || true
            fi
          done

      - name: 🔥 CLEAN EASYJSON (cực mạnh)
        run: |
          echo "Before clean: $(wc -l < coverage_all.out) lines"

          # Cách 1: Dùng grep -v để lọc
          grep -v -E 'easyjson|dto/request|request_easyjson|test/easyjson|_easyjson' coverage_all.out > coverage_temp.out
          mv coverage_temp.out coverage_all.out

          # Cách 2: Xóa các dòng có chứa từ khóa bằng sed (chạy nhiều lần cho chắc)
          for keyword in easyjson dto/request request_easyjson test/easyjson _easyjson; do
            sed -i "/$keyword/d" coverage_all.out
          done

          echo "After clean: $(wc -l < coverage_all.out) lines"

          # Kiểm tra còn không
          if grep -q 'easyjson' coverage_all.out; then
            echo " STILL FOUND easyjson! Trying harder..."
            grep -v 'easyjson' coverage_all.out > coverage_final.out
            mv coverage_final.out coverage_all.out
          fi

          # Hiển thị 5 dòng đầu để kiểm tra
          echo "First 5 lines:"
          head -5 coverage_all.out

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage_all.out
          fail_ci_if_error: true
          verbose: true
