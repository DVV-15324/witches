name: Run tests and upload coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Clean old coverage files
        run: rm -f coverage*.out coverage_all.out

      - name: Set environment variables
        run: |
          echo "APP_PORT=8080" >> $GITHUB_ENV
          echo "TEST_EMPTY=dummy_value" >> $GITHUB_ENV
          echo "TEST_INVALID=dummy_value" >> $GITHUB_ENV

      - name: Run all tests with coverage (skip easyjson packages)
        run: |
          # Chạy test cho từng nhóm, mỗi nhóm ghi ra file riêng
          go test -race -coverprofile=coverage_response.out -covermode=atomic ./pkg/core/response/... || true
          go test -race -coverprofile=coverage_utils.out -covermode=atomic ./pkg/core/utils || true
          go test -race -coverprofile=coverage_templates.out -covermode=atomic ./pkg/core/templates/... || true
          go test -short -race -coverprofile=coverage_pagination.out -covermode=atomic ./test/handler/pagination || true
          go test -short -race -coverprofile=coverage_rate_limit.out -covermode=atomic ./test/handler/rate_limit || true
          go test -short -race -coverprofile=coverage_simple.out -covermode=atomic ./test/handler/simple || true

      - name: Merge and clean coverage
        run: |
          echo "mode: atomic" > coverage_all.out
          for f in coverage_*.out; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              echo "Adding $f ($(wc -l < $f) lines)"
              tail -n +2 "$f" >> coverage_all.out 2>/dev/null || true
            fi
          done

          # Xóa tất cả dòng chứa các từ khóa dư thừa
          sed -i '/easyjson/d' coverage_all.out
          sed -i '/dto\/request/d' coverage_all.out
          sed -i '/request_easyjson/d' coverage_all.out
          sed -i '/response_easyjson/d' coverage_all.out
          sed -i '/_easyjson/d' coverage_all.out

          echo "After cleaning: $(wc -l < coverage_all.out) lines"
          head -3 coverage_all.out

      - name: Validate coverage file
        run: |
          if [ ! -s coverage_all.out ] || [ "$(wc -l < coverage_all.out)" -le 1 ]; then
            echo "Error: coverage_all.out is empty or invalid!"
            exit 1
          fi
          echo "Coverage file valid with $(wc -l < coverage_all.out) lines"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage_all.out
          fail_ci_if_error: true
          verbose: true
